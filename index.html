<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10091d">
  <title>Where Winds Meet — Play Free Now</title>
  <meta name="description" content="Enter the world of Where Winds Meet and play for free.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Noto+Sans:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="hero">
    <section class="video-shell" data-i18n-aria="videoAria" aria-label="Where Winds Meet gameplay video">
      <span class="frame-corner frame-corner--tl" aria-hidden="true"></span>
      <span class="frame-corner frame-corner--tr" aria-hidden="true"></span>
      <span class="frame-corner frame-corner--bl" aria-hidden="true"></span>
      <span class="frame-corner frame-corner--br" aria-hidden="true"></span>
      <video id="wwm-video" preload="metadata" playsinline autoplay muted loop poster="where-winds-meet_1763459661_md.jpg">
        <source src="https://github.com/Ayoublaouriki/WWM-2/releases/download/v1.0.0/WWM_clip_2.mp4" type="video/mp4">
      </video>
      <button class="video-trigger" id="video-trigger" type="button" data-i18n-aria="playAria" aria-label="Play video">
        <span class="play-ring" aria-hidden="true"><span class="play-triangle"></span></span>
        <strong data-i18n="playTitle">WATCH THE ADVENTURE</strong>
        <small data-i18n="playHint">Click to play</small>
      </button>
      <div class="video-status" aria-hidden="true"><span class="status-dot"></span>GAMEPLAY PREVIEW</div>
    </section>

    <div class="proof" data-i18n-aria="featuresAria" aria-label="Game features">
      <span data-i18n="featureCollect">EXPLORE THE WORLD</span><i></i><span data-i18n="featureTeam">MASTER MARTIAL ARTS</span><i></i><span data-i18n="featureBattle">FIGHT YOUR DESTINY</span>
    </div>

    <div class="cta-zone">
      <a class="cta" id="cta" href="https://www.broevo.com/C42TG9D/M1NBQ79/" target="_blank" rel="noopener noreferrer">
        <span class="cta__flare" aria-hidden="true"></span>
        <span class="cta__icon" aria-hidden="true">▶</span>
        <span class="cta__copy"><strong data-i18n="ctaTitle">PLAY FREE NOW</strong><small data-i18n="ctaSub">Enter the world of Where Winds Meet</small></span>
        <span class="cta__arrow" aria-hidden="true">›</span>
      </a>
      <p class="cta-note" data-i18n="ctaNote">FREE TO PLAY · ENTER THE ADVENTURE</p>
    </div>
  </main>
  <div class="captcha-backdrop" id="captcha-backdrop" hidden>
    <form class="captcha-card" id="captcha-form">
      <button class="captcha-close" id="captcha-close" type="button" aria-label="Close swipe popup">×</button>
      <div class="popup-creative"><img src="where-winds-meet_1763459661_md.jpg" alt="Where Winds Meet" /></div>
      <span class="captcha-kicker">READY TO PLAY?</span>
      <h2>Swipe to unlock</h2>
      <p>Complete the swipe to activate the download button.</p>
      <div class="swipe-cta" id="swipe-cta" hidden>
        <span class="swipe-cta__label" id="swipe-cta-label">SWIPE TO PLAY FREE</span>
        <input id="swipe-cta-range" type="range" min="0" max="100" value="0" step="1" aria-label="Swipe to activate the button">
        <span class="swipe-cta__handle" aria-hidden="true">›</span>
      </div>
      <a class="popup-cta is-disabled" id="popup-cta" href="#">DOWNLOAD FOR FREE <span>↗</span></a>
    </form>
  </div>
  <script src="script.js"></script>
</body>
</html>
